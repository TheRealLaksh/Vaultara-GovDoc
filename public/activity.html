<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#F6F3EC">
    <title>Activity | Vaultara</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap">
    <link rel="stylesheet" href="vendor/phosphor/style.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <a href="#main" class="skip-link">Skip to content</a>

    <div class="app">
        <aside class="sidebar" id="sidebar"></aside>

        <main class="main" id="main">
            <div class="main-inner">
                <header class="page-head reveal">
                    <div>
                        <h1>Activity</h1>
                        <p>A record of what happened in your account. The latest 20 actions are shown, and entries cannot be edited or deleted.</p>
                    </div>
                </header>

                <div class="panel reveal reveal-1" style="padding: 12px 28px;">
                    <ol class="log-list" id="logList" aria-busy="true" aria-live="polite">
                        <li class="skeleton" aria-hidden="true" style="min-height:64px; margin:14px 0;"></li>
                        <li class="skeleton" aria-hidden="true" style="min-height:64px; margin:14px 0;"></li>
                        <li class="skeleton" aria-hidden="true" style="min-height:64px; margin:14px 0;"></li>
                    </ol>
                </div>
            </div>
        </main>

        <nav class="mobile-nav" id="mobileNav"></nav>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/logger.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/shell.js"></script>
    <script src="js/activity.js"></script>
</body>
</html>
