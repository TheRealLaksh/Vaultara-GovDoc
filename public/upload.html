<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#F6F3EC">
    <title>Upload a document | Vaultara</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap">
    <link rel="stylesheet" href="vendor/phosphor/style.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <a href="#main" class="skip-link">Skip to content</a>

    <div class="app">
        <aside class="sidebar" id="sidebar"></aside>

        <main class="main" id="main">
            <div class="main-inner">
                <header class="page-head reveal">
                    <div>
                        <h1>Upload a document</h1>
                        <p>It stays private to you until you share it.</p>
                    </div>
                </header>

                <div class="panel panel-narrow reveal reveal-1">
                    <form id="uploadForm" novalidate>
                        <div class="form-group">
                            <label for="docTitle">Document title</label>
                            <input type="text" id="docTitle" name="title" placeholder="For example, Aadhaar card…" maxlength="120" autocomplete="off" required>
                        </div>

                        <div class="form-group">
                            <label for="docCategory">Category</label>
                            <select id="docCategory" name="category">
                                <option value="Identity">Identity document</option>
                                <option value="Education">Education certificate</option>
                                <option value="Health">Health record</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <span class="label" id="fileLabel">File</span>
                            <div class="dropzone" id="dropzone">
                                <i class="ph-bold ph-cloud-arrow-up" aria-hidden="true"></i>
                                <strong>Drop a file here or choose one</strong>
                                <small>PDF, JPEG or PNG, up to 500 KB</small>
                                <span class="file-name hidden" id="fileName"></span>
                                <input type="file" id="fileInput" name="file" accept="image/jpeg,image/png,application/pdf" aria-labelledby="fileLabel" required>
                            </div>
                        </div>

                        <div class="status" id="uploadStatus" role="status" aria-live="polite"></div>

                        <button type="submit" class="btn btn-primary" id="uploadBtn">
                            <i class="ph-bold ph-upload-simple" aria-hidden="true"></i>Upload to vault
                        </button>
                    </form>
                </div>
            </div>
        </main>

        <nav class="mobile-nav" id="mobileNav"></nav>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/logger.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/shell.js"></script>
    <script src="js/upload.js"></script>
</body>
</html>
