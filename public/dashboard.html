<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#F6F3EC">
    <title>Your vault | Vaultara</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap">
    <link rel="stylesheet" href="vendor/phosphor/style.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <a href="#main" class="skip-link">Skip to content</a>

    <div class="app">
        <aside class="sidebar" id="sidebar"></aside>

        <main class="main" id="main">
            <div class="main-inner">
                <div id="verifyBanner" class="banner hidden" role="status">
                    <div class="banner-text">
                        <i class="ph-bold ph-warning" aria-hidden="true"></i>
                        <div>
                            <strong>Verify your email</strong>
                            <p>Documents shared with you and your family only appear once your email is verified.</p>
                        </div>
                    </div>
                    <button type="button" class="btn btn-secondary btn-sm" id="sendVerifyBtn">Send link</button>
                </div>

                <header class="page-head reveal">
                    <div>
                        <h1>Your vault</h1>
                        <p>Everything you own, plus what family and friends have shared with you.</p>
                    </div>
                    <div class="page-stat">
                        <div class="page-count" id="docCountDisplay" aria-live="polite">0</div>
                        <div class="hint" id="docCountLabel">documents</div>
                    </div>
                </header>

                <div class="toolbar reveal reveal-1">
                    <div class="field-inline has-icon">
                        <i class="ph-bold ph-magnifying-glass" aria-hidden="true"></i>
                        <input type="text" id="searchBar" name="q" placeholder="Search by name…" aria-label="Search documents" autocomplete="off">
                    </div>
                    <select id="categoryFilter" name="category" aria-label="Filter by category">
                        <option value="all">All categories</option>
                        <option value="Identity">Identity</option>
                        <option value="Education">Education</option>
                        <option value="Health">Health</option>
                    </select>
                </div>

                <div id="docGrid" class="doc-grid" aria-busy="true" aria-live="polite">
                    <div class="skeleton" aria-hidden="true"></div>
                    <div class="skeleton" aria-hidden="true"></div>
                    <div class="skeleton" aria-hidden="true"></div>
                </div>
            </div>
        </main>

        <nav class="mobile-nav" id="mobileNav"></nav>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/logger.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/shell.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
